# Generates from wit/cuo-mod.wit the ClassicUO host's C# signature table for the p2
# component bridge (root `make gen-mod-wit-sig`); bin wit-cs-gen writes dotnet/Cuo.g.cs.
[workspace]

[package]
name = "wit-p1-gen"
version = "0.1.0"
edition = "2021"
publish = false
# src/bin/wit-cs-gen.rs is the C# twin; plain `cargo run` stays the Rust generator.
default-run = "wit-p1-gen"

[dependencies]
wit-parser = "0.247"
anyhow = "1"
