# Generates from wit/cuo-mod.wit:
#   rust/src/p1/cuo.rs       the wasm32-wasip1 twin of the cuo:mod interfaces (JSON over mod_call)
#   rust/src/sigcheck.rs     compile-time proof that the two agree
# Run from the SDK root: `make gen-p1`.
[workspace]

[package]
name = "wit-p1-gen"
version = "0.1.0"
edition = "2021"
publish = false
# src/bin/wit-cs-gen.rs is the C# twin; plain `cargo run` stays the Rust generator.
default-run = "wit-p1-gen"

[dependencies]
wit-parser = "0.247"
anyhow = "1"
