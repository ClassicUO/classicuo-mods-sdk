# The Rust mod SDK. A mod is a cdylib depending on this crate, built for wasm32-wasip2:
# a component implementing wit/cuo-mod.wit.
# Standalone crate (own empty workspace).
[workspace]

[package]
name = "cuo-mod-sdk"
version = "0.3.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.57"

[lib]
crate-type = ["rlib"]

[profile.release]
opt-level = "s"
strip = true

[[example]]
name = "low_hp"
path = "examples/low_hp/main.rs"
crate-type = ["cdylib"]
