# The Rust mod SDK. A mod is a cdylib depending on this crate; one source builds for
#   wasm32-wasip1 (feature `p1`, default): core module, FlatBuffers ECS ABI + env.mod_call
#   wasm32-wasip2 (feature `p2`): component implementing wit/cuo-mod.wit
# Standalone crate (own empty workspace).
[workspace]

[package]
name = "cuo-mod-sdk"
version = "0.3.0"
edition = "2021"

[features]
default = ["p1"]
p1 = ["dep:planus"]
p2 = ["dep:wit-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# planus 1.3.0 derives serde on every generated type, hence serde/derive above.
planus = { version = "=1.3.0", optional = true }
wit-bindgen = { version = "0.57", optional = true }

[lib]
crate-type = ["rlib"]

[profile.release]
opt-level = "s"
strip = true

[[example]]
name = "low_hp"
path = "examples/low_hp/main.rs"
crate-type = ["cdylib"]
